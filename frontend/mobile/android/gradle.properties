# Reglages memoire adaptes a cette machine (12 Go, partages avec l'IDE).
#
# Le defaut du modele Flutter demande -Xmx8G -XX:MaxMetaspaceSize=4G : sur
# 12 Go, avec plusieurs JVM lancees en parallele (Gradle, demon Kotlin,
# compilateur), cela provoque un manque de memoire a l'echelle du systeme.
#
# Abaisse de 3g a 2g le 04/10, apres un echec de `assembleRelease` a 56 s avec
# « Native memory allocation (malloc) failed to allocate 9232 bytes ». Neuf
# kilo-octets : ce n'est pas la machine qui manquait de memoire — il restait
# 4 Go — c'est la JVM qui ne pouvait plus etendre son tas natif. Son propre
# rapport le dit :
#
#   « This process is running with CompressedOops enabled, and the Java Heap
#     may be blocking the growth of the native heap. Decrease Java heap size. »
#
# Sous CompressedOops le tas Java est place dans les 32 premiers Go d'espace
# d'adressage et en plafonne la croissance du tas natif. Lui laisser moins
# laisse plus a l'autre. Deux giga-octets suffisent : la compilation lourde est
# celle de Dart en AOT, qui tourne dans son propre processus.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Djava.net.preferIPv4Stack=true
org.gradle.workers.max=2
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Pas de configuration-cache : la tache ReleaseMinSdkCheck de Flutter
# conserve une reference a Project, que Gradle ne sait pas serialiser.
kotlin.incremental=true

# JDK 21 fourni avec la chaine d'outils locale.
org.gradle.java.home=C:/Users/HP/Desktop/App_Maison_Blanche/_toolchain/jdk

# Les paquets SDK sont deja installes. Sans ce drapeau, Gradle interroge le
# depot Android au demarrage et peut tenter d'installer le NDK.
android.builder.sdkDownload=false

# Connexion lente et instable : mieux vaut patienter qu'abandonner. Des
# delais courts faisaient echouer le build sur un simple ralentissement, et
# Gradle ne reprend pas un telechargement interrompu.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=300000

android.useAndroidX=true
android.enableJetifier=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

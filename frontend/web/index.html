<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      La couleur de la barre du navigateur, dans les deux thèmes de la charte.
      Elle valait #4F2BD9, un violet d'avant la charte qu'aucun jeton ne
      porte : la barre du téléphone ne s'accordait avec aucun écran.
    -->
    <meta name="theme-color" content="#3A2FC9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0d26" media="(prefers-color-scheme: dark)" />

    <!--
      Le nom, et la promesse.

      Le titre, la description et les métadonnées de partage annonçaient
      « Acalia » — le nom d'avant VeriProf, donc deux noms en arrière. Ce sont
      les seules lignes que voient un moteur de recherche et un lien partagé
      sur WhatsApp : c'est là que le nom compte le plus.
    -->
    <title>EduQuali — Trouvez le professeur qu'il vous faut</title>
    <meta
      name="description"
      content="Des cours en direct, à quinze élèves, sur le programme guinéen. Chaque professeur passe trois contrôles : identité, diplôme, compétence."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EduQuali" />
    <meta property="og:locale" content="fr_GN" />
    <meta property="og:title" content="EduQuali — Trouvez le professeur qu'il vous faut" />
    <meta
      property="og:description"
      content="Des cours en direct, à quinze élèves, sur le programme guinéen."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Les polices sont servies d'ici, pas de Google.

      Cette page préchargeait Inter et Poppins depuis `fonts.googleapis.com`.
      Ce sont les polices **d'avant la charte** : plus une seule règle ne les
      nomme depuis que Lexend et Gabarito les ont remplacées. Chaque
      chargement de page allait donc chercher deux familles inutilisées —
      deux connexions, deux allers-retours sur un réseau guinéen, et l'adresse
      IP de chaque visiteur envoyée à Google pour rien.

      `tokens.css` déclare les sept fichiers depuis `/polices/`, en woff2.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/polices/Lexend-400.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/polices/Gabarito-800.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
